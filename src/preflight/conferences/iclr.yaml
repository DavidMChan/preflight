# ICLR main conference (2027 cycle). The page limits and text block are
# unchanged from 2026; what is new is a required AI use statement, set out in
# the AI Policy for Authors (https://iclr.cc/Conferences/2027/AIPolicyForAuthors)
# and printed as a required section in the 2027 template.
#
# NOTE ON NUMBERS: unlike the ACL profile, whose tolerances come from the
# official aclpubcheck implementation, the geometry below was measured off the
# PDF that ships inside the official template
# (https://github.com/ICLR/Master-Template/raw/master/iclr2026.zip) and
# cross-checked against iclr2026_conference.sty: US Letter, \oddsidemargin
# 0.5in (so a 1.5in left margin), \textwidth 5.5in, \textheight 9in, 10pt
# Times, single column. The 2027 style files
# (https://media.iclr.cc/Conferences/ICLR2027/iclr-2027-style-files.zip) keep
# the same text block. There is no official ICLR format checker to defer to.
#
# The page limit moves year to year: 9 content pages at submission, 10 during
# the rebuttal and for the camera ready (author guidelines, 2026 and 2027).
# Set the track accordingly.

conference:
  key: iclr
  name: ICLR (main conference)
  extends: base
  default_track: main
  style: "ICLR (US Letter, single-column, 10pt Times)"

# ICLR has its own track set; do not inherit base's.
tracks_replace: true
tracks:
  main:
    content_page_limit: 9
    description: >-
      Submission — 9 pages of main text; references, the AI use, ethics and
      reproducibility statements, acknowledgments and appendices do not count
      toward the limit. Papers with main text beyond the limit are desk-rejected.
  camera_ready:
    content_page_limit: 10
    description: >-
      Rebuttal revision and camera ready — the limit rises to 10 pages to allow
      for new results and discussion, and is strictly enforced.

geometry:
  page_width_pt: 612.0     # US Letter
  page_height_pt: 792.0
  paper_size_label: "US Letter"
  margin_left_pt: 108.0    # 1in + \oddsidemargin 0.5in
  margin_right_pt: 108.0   # 612 - 108 - \textwidth 5.5in
  # \textheight 9in starts at y=82pt; the running head sits above it at y=28pt
  # and is exempted through fonts.ignore_small_text_regex below.
  margin_top_pt: 82.0
  margin_bottom_pt: 62.0
  tolerance_left_pt: 4.0
  tolerance_right_pt: 6.0
  tolerance_top_pt: 4.0
  # TeX lets the last line on a page hang up to \maxdepth (5pt at 10pt) below
  # the text block, and the extractor's boxes add font descent on top of that:
  # ordinary body lines already end 2pt past it, and the "k=1" limit under a
  # summation that closes a page reaches 5.5pt. Neither is the author's doing.
  tolerance_bottom_pt: 6.0

columns:
  expected_columns: 1

fonts:
  body_size_pt: 10.0
  min_font_size_pt: 8.0
  allowed_font_substrings:
    - NimbusRomNo9L
    - TeXGyreTermes
    - TimesNewRoman
    - Times-Roman
    - NimbusMonL
    - Inconsolatazi4
    - CMR
    - CMMI
    - LMRoman
  # Two things legitimately sit outside the text block in the ICLR template:
  # the 8pt line-number ruler in the left margin, and the running head above it.
  ignore_small_text_regex: '^\s*\d{1,4}\s*$|^(Under review as|Published as) a conference paper at ICLR'

structure:
  # ICLR does not require a Limitations section; the guide recommends ethics and
  # reproducibility statements instead, so absence is not reportable here.
  limitations_required: false
  appendix_must_follow_references: true
  appendix_must_be_two_column: false
  # The three statements go at the end of the main text, before the
  # references, and none counts toward the page limit — so treating the
  # earliest of them as the start of unlimited material is correct. The
  # reproducibility and AI use kinds resolve to the `statements:` aliases below.
  ethics_aliases: &ethics_aliases
    [Ethics Statement, Ethical Statement, Ethical Considerations, Ethics,
     Ethics and Broader Impact, Broader Impact, Broader Impacts, Broader Impact Statement]
  unlimited_after:
    [limitations, references, acknowledgments, ethics, reproducibility, ai_use, appendix]

# Checked by core.statements (presence, leftover template text, placement,
# length) and, with --llm, llm_statement_coverage (the required task list).
statements:
  ai_use:
    title: AI use statement
    requirement: required
    aliases:
      [AI Use Statement, AI Use, AI-Use Statement, AI Usage Statement, AI Usage,
       AI Use Disclosure, AI Disclosure, AI Disclosure Statement, Statement on AI Use,
       Disclosure of AI Use, Declaration of AI Use, Use of AI, Use of AI Tools,
       Use of Generative AI, Use of Generative AI Tools, Generative AI Use Statement,
       Generative AI Usage, LLM Usage, LLM Usage Statement, LLM Usage Disclosure, LLM Use,
       LLM Use Statement, Declaration of LLM Usage, Use of LLMs, Usage of LLMs,
       Use of Large Language Models, The Use of Large Language Models,
       The Use of Large Language Models (LLMs)]
    before_references: true
    # "This statement should not be more than 1 page." (2027 template)
    max_pages: 1
    why: >-
      ICLR 2027 requires every submission to disclose AI use in a dedicated section (AI
      Policy for Authors; the template marks it "required"). It does not count toward the
      page limit.
    remedy: >-
      Add an unnumbered "AI use statement" section at the end of the main text, before the
      references, following the template: for every task with required disclosure, say
      whether generative AI tools were used, were not used, or the task is not applicable;
      list any recommended-disclosure uses; and state that all AI-assisted work was reviewed.
    # Placeholders from the template (square brackets) and the policy page (angle brackets).
    template_text:
      - '[\[<]\s*(?:other\s+)?tasks with (?:required|recommended) disclosure\s*[\]>]'
      - '[\[<]\s*the rest of the required disclosure tasks\s*[\]>]'
      - '\[\s*Elaborate\b'
      - 'This section is required and does not count toward the page limit'
      - 'See the ICLR 2027 AI Policy for Authors for more details'
    must_address_rule: >-
      for every task with required disclosure, it must say that generative AI tools were
      used for it, that they were not used for it, or that the task is not applicable to
      this work (ICLR 2027 AI Policy for Authors).
    must_address:
      - Generate synthetic data sets
      - Help develop theoretical models or conceptual frameworks
      - Formulate mathematical claims
      - Provide critical ingredients for proving mathematical claims
      - Assist in the writing of proofs
      - Propose or refine hypotheses
      - Design or provide feedback on research methodology or experiments
      - Implement methods
      - Assist with translation
      - Clean and reformat datasets
      - Support qualitative and thematic data analysis
      - Interpret results
  ethics:
    title: Ethics statement
    requirement: recommended
    aliases: *ethics_aliases
    before_references: true
    max_pages: 1
    why: >-
      ICLR recommends one at the end of the main text whenever the work raises Code of
      Ethics questions: human subjects, dataset releases, potentially harmful insights or
      applications, conflicts of interest or sponsorship, bias and fairness, privacy and
      security, legal compliance, or research integrity (e.g. IRB). Reviewers are asked to
      flag potential violations. The FAQ says a paper that raises none of these needs no
      statement.
    remedy: >-
      If the work touches any Code of Ethics topic, add an unnumbered "Ethics statement"
      (at most 1 page) at the end of the main text, before the references.
    template_text:
      - 'This section is recommended and does not count toward the page limit'
      - 'If authors feel that their paper submission raises questions regarding the Code of Ethics'
  reproducibility:
    title: Reproducibility statement
    requirement: recommended
    aliases:
      [Reproducibility Statement, Reproducibility, Statement on Reproducibility,
       Reproducibility and Code Availability]
    before_references: true
    why: >-
      ICLR strongly encourages a paragraph-long reproducibility statement at the end of the
      main text that points to the parts of the paper, appendix and supplementary material
      supporting reproduction. It does not count toward the page limit.
    remedy: >-
      Add an unnumbered "Reproducibility statement" paragraph at the end of the main text,
      before the references, referencing (not repeating) the relevant appendix sections,
      proofs, data-processing descriptions and anonymous code.
    template_text:
      - 'This section is recommended and does not count toward the page limit'
      - 'It is important that the work published in ICLR is reproducible'

template:
  running_head:
    pattern: '(?:Under review as|Published as) a conference paper at ICLR \d{4}'
    expected:
      main: Under review as a conference paper at ICLR 2027
      camera_ready: Published as a conference paper at ICLR 2027

surface:
  # "The abstract must be limited to one paragraph." (2027 template)
  abstract_max_paragraphs: 1

anonymity:
  expected_author_line: "Anonymous authors"
  # The title block runs from the title at y=80 to the double-blind line at
  # y=158; the ABSTRACT heading starts at y=188.
  title_block_height_pt: 185.0

structure_note: >-
  ICLR templates print a line-number ruler in the margin and a "Under review as
  a conference paper at ICLR" running head above the text block; the margin and
  font checks exempt both via fonts.ignore_small_text_regex.

severity:
  # Both are stated desk-rejection conditions in the author guide.
  page_limit: error
  anonymity_title_block: error

cfp:
  page_limit: >-
    Main text is 9 pages or fewer at submission, rising to 10 pages for the rebuttal
    revision and camera ready. The limit is strictly enforced and papers whose main text
    exceeds it are desk-rejected. References are unlimited, and unlimited appendices may
    follow the bibliography.
  paper_size: >-
    Submissions must use the official ICLR style files for the year: US Letter,
    single column, 10pt Times.
  margins: >-
    Margins come from the ICLR style file and should not be altered to fit content.
  body_font_size: >-
    The template sets 10pt body type with 11pt leading; do not shrink it to fit the page
    limit.
  anonymity_title_block: >-
    ICLR is double blind. Any paper revealing author identity in the main text or the
    supplementary material will be desk-rejected. The title block should read
    "Anonymous authors / Paper under double-blind review".
  anonymity_urls: >-
    Code and demo links must be anonymous, and the host must not track visitors — a
    tracking host can reveal reviewer identity and puts the submission at risk of
    rejection. Use an anonymous repository, or share the link in a comment to reviewers
    and ACs after the forums open.
  anonymity_self_reference: >-
    Related arXiv papers by the same authors do not break anonymity, but they must be
    cited in the third person.
  appendix_position: >-
    Supplementary text should appear after the references and be clearly marked as an
    appendix. Reviewers are not required to read it.
  references_position: >-
    The bibliography does not count toward the page limit and unlimited additional pages
    are allowed for it.
  statement.ai_use: >-
    Required: AI use statement. Authors must disclose AI use in a mandatory section of the
    paper, which does not count toward the page limit. For each task with required
    disclosure, state whether generative AI was used, was not used, or the task is not
    applicable (AI Policy for Authors). The template caps it at 1 page.
  statement.ethics: >-
    Recommended: Ethics statement, at the end of the main text before references, for
    submissions that raise Code of Ethics questions. It does not count toward the page
    limit, but should not be more than 1 page.
  statement.reproducibility: >-
    Recommended: Reproducibility statement. Authors are strongly encouraged to include a
    paragraph-long Reproducibility Statement at the end of the main text (before
    references). It does not count toward the page limit.
  llm_statement_coverage.ai_use: >-
    Authors must disclose the specific tasks where generative AI tools were used, and state
    which required disclosure tasks were not applicable (AI Policy for Authors).
  running_head: >-
    Authors are required to use the current ICLR LaTeX style files, not previous versions;
    tweaking the style files may be grounds for rejection. \iclrfinalcopy must stay
    commented out for submission.
  abstract_paragraphs: >-
    The abstract must be limited to one paragraph (ICLR 2027 template).

unverifiable:
  - id: originality
    title: Originality and prior publication
    message: >-
      Establishing that the work is unpublished needs cross-paper matching against the
      authors' other work, which the PDF cannot answer.
  - id: dual_submission
    title: Concurrent / dual submission
    message: >-
      Nothing in the PDF shows whether this work is under review elsewhere. Papers on
      arXiv or presented at non-archival workshops do not violate ICLR's dual-submission
      policy; parallel submission to another conference or journal does.
  - id: ai_use_accuracy
    title: Accuracy of the AI use statement
    message: >-
      The statement's presence, finish and coverage are checked above; whether it truthfully
      describes how AI was used is not a property of the PDF. The submission form also asks
      for some of this information, and the two should agree. A substantial falsehood or
      misrepresentation produced by an LLM is a Code of Ethics violation and might lead to
      desk rejection.
  - id: reciprocal_reviewing
    title: Reciprocal reviewing requirement
    message: >-
      Every submission needs at least one author registered to review at least 3 papers,
      and authors on 3+ papers must review 6. This is tracked in OpenReview, not the PDF,
      and failing it is a desk-rejection condition.
  - id: abstract_deadline
    title: Abstract submitted by the earlier deadline
    message: >-
      Abstracts are due five days before the full paper, must be genuine rather than
      placeholders, and no authors can be added afterwards. None of this is visible here.
  - id: authorship
    title: Correct authorship
    message: >-
      The PDF can catch leaked identities, but cannot confirm that all and only substantial
      contributors are listed on the submission form. Authors cannot be changed after the
      abstract deadline, and LLMs are not eligible for authorship.
  - id: code_of_ethics
    title: Conformance to the ICLR Code of Ethics
    message: >-
      All authors must read and acknowledge the ICLR Code of Ethics at submission time.
      Whether the research conforms to it is a judgement about the work, not the PDF.
  - id: supplementary
    title: Supplementary material and code release
    message: >-
      Whether a linked repository actually contains runnable, anonymized code can only be
      established by opening it.
