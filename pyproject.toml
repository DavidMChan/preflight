[project]
name = "preflight"
version = "0.1.0"
description = "Automated pre-flight checker for academic research paper submissions (ARR/ACL and friends)"
readme = "README.md"
authors = [{ name = "David Chan", email = "david@iridescent.io" }]
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["acl", "arr", "peer-review", "pdf", "preflight", "desk-rejection"]

dependencies = [
    "pymupdf>=1.24",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hallucinator = ["hallucinator>=0.2.2"]

[project.scripts]
preflight = "preflight.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
